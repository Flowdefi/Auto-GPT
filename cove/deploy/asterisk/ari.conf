; ARI is how Cove's dialer drives Asterisk: originate, bridge, transfer to a
; live agent, and stream the AI voice agent's audio into a channel.
;
; Bind this to localhost only and reach it over the container network or an
; SSH tunnel. Never expose 8088 to the internet.

[general]
enabled = yes
pretty = yes
allowed_origins = http://localhost:8080

[cove]
type = user
read_only = no
password = CHANGEME_ARI_SECRET
password_format = plain

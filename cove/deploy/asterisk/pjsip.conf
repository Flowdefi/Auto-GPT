; Cove — minimal PJSIP profile for an outbound collections floor.
; Replace every CHANGEME before dialing anything real.

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
; Required behind NAT or a cloud host. Without these you get one-way audio.
external_media_address = CHANGEME_PUBLIC_IP
external_signaling_address = CHANGEME_PUBLIC_IP
; Docker's default bridge lives inside 172.16.0.0/12. Asterisk must know these
; are local even when running with host networking.
local_net = 10.0.0.0/8
local_net = 172.16.0.0/12
local_net = 192.168.0.0/16

; ---------------------------------------------------------------------------
; Carrier trunk. Pick a carrier that signs STIR/SHAKEN A-attestation on your
; numbers — attestation is what keeps your calls out of "Spam Likely".
; ---------------------------------------------------------------------------
[carrier]
type = registration
transport = transport-udp
outbound_auth = carrier-auth
server_uri = sip:CHANGEME_CARRIER_HOST
client_uri = sip:CHANGEME_USER@CHANGEME_CARRIER_HOST
retry_interval = 60

[carrier-auth]
type = auth
auth_type = userpass
username = CHANGEME_USER
password = CHANGEME_PASSWORD

[carrier]
type = aor
contact = sip:CHANGEME_CARRIER_HOST

[carrier]
type = endpoint
transport = transport-udp
context = from-carrier
disallow = all
allow = ulaw
allow = opus
outbound_auth = carrier-auth
aors = carrier
from_user = CHANGEME_DID
direct_media = no
; Recording every leg is a compliance requirement, not a preference.
; Two-party-consent states need the verbal disclosure too — the script handles it.

[carrier]
type = identify
endpoint = carrier
match = CHANGEME_CARRIER_HOST

; ---------------------------------------------------------------------------
; Agent softphones. One block per collector; WebRTC so remote 1099 staff need
; nothing but a browser.
; ---------------------------------------------------------------------------
[agent-template](!)
type = endpoint
context = from-agent
disallow = all
allow = opus
allow = ulaw
webrtc = yes
direct_media = no

[1001](agent-template)
auth = 1001-auth
aors = 1001

[1001-auth]
type = auth
auth_type = userpass
username = 1001
password = CHANGEME_AGENT_SECRET

[1001]
type = aor
max_contacts = 2
remove_existing = yes

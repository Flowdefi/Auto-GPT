; Cove dialplan. Outbound collections only.
;
; The call-window and consent checks live in the application (see
; src/lib/compliance.ts) because they need account state. What lives here is
; the belt-and-braces layer: recording, caller ID, and a hard stop on any
; number the application did not pre-clear.

[globals]
AGENCY = TF Recovery
OUTBOUND_CID = CHANGEME_DID
RECORDING_DIR = /var/spool/asterisk/monitor

[from-agent]
; Agent-initiated dial. The application passes the cleared number.
exten => _1NXXNXXXXXX,1,NoOp(Outbound to ${EXTEN} by ${CALLERID(num)})
 same => n,Set(CALLERID(all)=${AGENCY} <${OUTBOUND_CID}>)
 same => n,Set(CDR(userfield)=${COVE_ACCOUNT_ID})
 same => n,MixMonitor(${RECORDING_DIR}/${UNIQUEID}.wav,b)
 same => n,Dial(PJSIP/${EXTEN}@carrier,45)
 same => n,Hangup()

exten => _NXXNXXXXXX,1,Goto(from-agent,1${EXTEN},1)

; Anything else is a misdial or a bypass attempt. Refuse it loudly.
exten => _X.,1,NoOp(Blocked non-conforming destination ${EXTEN})
 same => n,Playback(ss-noservice)
 same => n,Hangup(21)

[from-carrier]
; Inbound callbacks from consumers who were left a message.
exten => _X.,1,NoOp(Inbound ${CALLERID(num)} -> ${EXTEN})
 same => n,MixMonitor(${RECORDING_DIR}/${UNIQUEID}-in.wav,b)
 same => n,Queue(inbound,t,,,300)
 same => n,Voicemail(1001@default,u)
 same => n,Hangup()

name: Meridian

on:
  push:
    paths:
      - "meridian/**"
      - ".github/workflows/meridian.yml"
  pull_request:
    paths:
      - "meridian/**"
      - ".github/workflows/meridian.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meridian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: meridian/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:collections

name: Meridian

on:
  push:
    paths:
      - "meridian/**"
      - ".github/workflows/meridian.yml"
  pull_request:
    paths:
      - "meridian/**"
      - ".github/workflows/meridian.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meridian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: meridian/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=critical
      - run: npx tsc --noEmit
      - run: npm run test:collections
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          MERIDIAN_AUTH_SECRET: e2e-only-not-a-real-secret-32chars
          MERIDIAN_SEED_DEMO: "true"
          CI: "true"

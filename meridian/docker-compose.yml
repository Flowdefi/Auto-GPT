services:
  meridian:
    build: .
    ports:
      - "3000:3000"
    environment:
      MERIDIAN_PUBLIC_URL: ${MERIDIAN_PUBLIC_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      AGENTMAIL_API_KEY: ${AGENTMAIL_API_KEY:-}
      AGENTMAIL_INBOX_TRITON: ${AGENTMAIL_INBOX_TRITON:-portfolios@agentmail.to}
      AETHER_FROM_EMAIL: ${AETHER_FROM_EMAIL:-desk@aethermarkets.io}
      MS_TENANT_ID: ${MS_TENANT_ID:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MS_MAILBOXES: ${MS_MAILBOXES:-portfolios@debtmarket.net}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MERIDIAN_MODEL: ${MERIDIAN_MODEL:-qwen2.5:14b}
      MERIDIAN_FAST_MODEL: ${MERIDIAN_FAST_MODEL:-llama3.2:3b}
      MERIDIAN_EMBED_MODEL: ${MERIDIAN_EMBED_MODEL:-nomic-embed-text}
    volumes:
      - meridian-data:/app/data
    restart: unless-stopped

volumes:
  meridian-data:
